<style>
@font-face{font-family:"IBM Plex Mono";font-weight:300;font-style:normal;font-display:swap;src:url("font/IBMPlexMono-Light.ttf") format("truetype")}
@font-face{font-family:"IBM Plex Mono";font-weight:400;font-style:normal;font-display:swap;src:url("font/IBMPlexMono-Regular.ttf") format("truetype")}
@font-face{font-family:"IBM Plex Mono";font-weight:700;font-style:normal;font-display:swap;src:url("font/IBMPlexMono-Bold.ttf") format("truetype")}
:root{--bg:#000;--panel:#000;--line:#232323;--ink:#e8e6e1;--dim:#7c7f84;--acc:#00ff3c;--warn:#ffb020;--err:#ff5a4a;--font:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:11.5px/1.45 var(--font);overflow:hidden}
#app{display:grid;grid-template-columns:270px minmax(0,1fr) 330px;grid-template-rows:44px minmax(0,1fr) 50px;height:100vh}
header,footer{display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);min-width:0}
header{grid-column:1/4;border-bottom:1px solid var(--line);overflow:hidden}footer{grid-column:1/4;border-top:1px solid var(--line)}
#lib{border-right:1px solid var(--line);overflow:auto;padding:10px;background:var(--panel)}
#comps{max-height:38vh;overflow-y:auto;scrollbar-width:thin}
#panel{border-left:1px solid var(--line);overflow:hidden;background:var(--panel);display:flex;flex-direction:column}
#panel section{padding:10px;overflow:auto;flex:1}
#view{position:relative;background:#141415;overflow:hidden;cursor:default;touch-action:none}#view.mv{cursor:move}#view.mv:active{cursor:grabbing}
#out{display:block}
#viewInfo{position:absolute;right:10px;bottom:8px;color:var(--dim);font-size:10px;pointer-events:none;text-align:right}
#view.drop{outline:2px dashed var(--acc);outline-offset:-6px}
h1{font-size:12px;letter-spacing:.18em;margin:0;font-weight:700;white-space:nowrap}
h2{font-size:10px;letter-spacing:.16em;color:var(--dim);margin:14px 0 6px;font-weight:600;display:flex;align-items:center}
h2:first-child{margin-top:2px}
h3{font-size:10px;letter-spacing:.12em;margin:14px 0 4px;color:var(--ink);font-weight:700}
p{margin:6px 0}.dim{color:var(--dim)}.grow{flex:1}.acc{color:var(--acc)}
a{color:var(--acc)}
button{font:inherit;color:var(--ink);background:#181818;border:1px solid var(--line);padding:5px 8px;cursor:pointer;letter-spacing:.06em;text-transform:uppercase;border-radius:2px;white-space:nowrap}
button:hover{border-color:#4a4a4a}button.on{background:var(--ink);color:#000;border-color:var(--ink)}button:disabled{opacity:.4;cursor:default}
button.tg{min-width:92px}button.rs{padding:3px 6px;color:var(--dim)}button.acc{border-color:var(--acc);color:var(--acc)}button.acc:hover{background:var(--acc);color:#000}
input,select,textarea{font:inherit;color:var(--ink);background:#161616;border:1px solid var(--line);padding:4px 6px;border-radius:2px;min-width:0}
select{max-width:100%}
input[type=range]{accent-color:var(--ink);padding:0;flex:1;min-width:40px}input[type=color]{padding:0;width:32px;height:24px;border:1px solid var(--line);background:none;flex:none}
input[type=number]{width:72px}input.num{width:64px}
textarea{width:100%;resize:vertical}
.ctl{display:flex;align-items:center;gap:6px;margin:4px 0}.ctl>label{width:118px;flex:none;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctl.col{flex-direction:column;align-items:stretch}.ctl.col>label{width:auto}.ctl output{width:36px;text-align:right;color:var(--dim)}
.ctl select{flex:1}
.row{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.item{display:flex;align-items:center;gap:6px;padding:5px 6px;border:1px solid transparent;cursor:pointer;border-radius:2px}
.item:hover{background:#161616}.item.on{border-color:#3a3a3a;background:#141414}
.item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item .nm small{display:block;color:var(--dim);font-size:9.5px}
.item .acts{display:none;gap:2px}.item:hover .acts,.item.on .acts{display:flex}.item .acts button,.item .tg{padding:2px 6px;min-width:0}
.item .tg.on{background:var(--acc);border-color:var(--acc);color:#000}
.item .ms{font-weight:400;font-size:9px;color:var(--dim);margin-left:4px}.item .ms.hot{color:var(--warn)}.item .err{color:var(--err);margin-left:4px}
.item.dragging{opacity:.45}.item.dropb{box-shadow:0 2px 0 0 var(--acc)}.item.dropt{box-shadow:0 -2px 0 0 var(--acc)}
#comps .item.pend{animation:pend .5s steps(2) infinite}@keyframes pend{50%{border-color:var(--acc)}}
body.learn #paneLayer [data-k][data-t=n],body.learn #paneLayer [data-k][data-t=b],body.learn #paneLayer [data-k][data-t=s],body.learn #paneLayer [data-l=opacity],body.learn #comps .item,body.learn #paneMidi [data-act]{outline:1px dashed var(--acc);outline-offset:1px}
.acts4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 0}.acts4 button{padding:5px 2px;font-size:9.5px;min-width:0}
.mlist .mrow{display:flex;gap:6px;align-items:center;padding:3px 0;border-bottom:1px solid var(--line)}.mlist .mrow b{font-size:10px;white-space:nowrap}.mlist .mrow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mlist .mrow button{padding:0 6px}
.dchips{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:6px 0}.dchips button{padding:4px 0;font-size:10px;min-width:0}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line);flex:none}.tabs button{border:0;border-radius:0;background:none;padding:8px 2px;font-size:10px;color:var(--dim);min-width:0}.tabs button.on{background:#181818;color:var(--ink)}
.hd{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}.hd input{font-weight:700}
.hd .info{color:var(--dim);font-size:10.5px;line-height:1.45}
hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.sec{margin:16px 0 4px;font-size:9.5px;letter-spacing:.16em;color:var(--acc);font-weight:700;border-top:1px solid var(--line);padding-top:8px}
#scrub{flex:1;min-width:60px}#bpm{width:56px}
#toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:var(--ink);color:#000;padding:6px 12px;border-radius:2px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;max-width:80vw;text-align:center}
#toast.show{opacity:1}
#help{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:30}
#help[hidden]{display:none}#help .box{background:var(--panel);border:1px solid #333;padding:22px 26px;max-width:700px;width:92%;max-height:90vh;overflow:auto}
#help table{border-collapse:collapse;margin-top:8px}#help td{padding:3px 12px 3px 0;vertical-align:top}#help td:first-child{color:var(--acc);white-space:nowrap}
#help h1{font-size:15px;letter-spacing:.24em}#help .hsub{margin:6px 0 0;letter-spacing:.04em}#help .hcred{margin:3px 0 14px;color:var(--dim);letter-spacing:.06em}#help .hfoot{display:flex;align-items:center;gap:16px;margin-top:16px}#help .hfoot p{margin:0;color:var(--dim);font-size:10px;line-height:1.5}#help a{color:var(--acc);text-decoration:none}#help a:hover{text-decoration:underline}
#help h2{margin:16px 0 6px}#help ul{margin:6px 0 8px;padding-left:16px}#help li{margin:5px 0}#help b{color:var(--ink)}
#help details{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}#help summary{cursor:pointer;font-size:10px;letter-spacing:.16em;color:var(--dim);font-weight:600}#help summary:hover,#help details[open] summary{color:var(--ink)}#help details[open] summary{margin-bottom:6px}
#help .strip{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;margin:12px 0 12px}#help .strip img{width:100%;aspect-ratio:1;display:block;background:#111}
body.clean #app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
body.clean header,body.clean footer,body.clean #lib,body.clean #panel,body.clean #viewInfo{display:none}
@media (max-width:1100px){#app{grid-template-columns:220px minmax(0,1fr) 290px}.ctl>label{width:100px}}
header .by{font-size:10px;letter-spacing:.18em;color:var(--dim);white-space:nowrap;text-decoration:none}header a.by:hover{color:var(--ink)}#projName{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}#projName:not(:empty)::before{content:'·';margin:0 10px 0 4px;color:#4a4a4a}
.qm{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;padding:0;margin:0 0 0 6px;border-radius:50%;font-size:9px;line-height:1;color:var(--dim);background:none;border:1px solid #3a3a3a;letter-spacing:0;min-width:0;text-transform:none;flex:none}.qm:hover{color:var(--ink);border-color:var(--ink)}
#hpop{position:fixed;z-index:35;background:#0d0d0d;border:1px solid #3a3a3a;padding:10px 12px;box-shadow:0 8px 28px rgba(0,0,0,.6);color:var(--ink);font-size:11px;line-height:1.5;max-height:70vh;max-width:340px;overflow:auto}#hpop[hidden]{display:none}#hpop h4{margin:0 0 6px;font-size:10px;letter-spacing:.12em;color:var(--acc);font-weight:700}#hpop p{margin:0 0 6px}#hpop ul{margin:0 0 6px;padding-left:16px}#hpop li{margin:2px 0}
.lng{display:inline-flex}.lng button{padding:5px 7px;min-width:0}.lng button+button{border-left:0}#help .lngrow{display:flex;align-items:center;gap:10px;margin:0 0 14px}
/* biblioteca de formas */
.shapes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 4px}
.shapes button{display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:4px;text-transform:none;letter-spacing:0;white-space:normal;text-align:left;min-width:0}
.shapes button img,.shapes button .ph{width:100%;aspect-ratio:1;display:block;background:#111;image-rendering:auto}
.shapes button span{font-size:9.5px;line-height:1.2;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shapes button:hover span{color:var(--ink)}.shapes button:hover{border-color:var(--acc)}
.assets .a{display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid var(--line)}.assets .a img{width:34px;height:34px;object-fit:contain;background:#f2f0ea;flex:none}.assets .a span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.assets .a button{padding:2px 6px}
/* paletas */
.palpick{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:8px 0 10px}.palpick .pp{display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:5px;min-width:0;text-transform:none}.palpick .pp.on{border-color:var(--acc);background:#181818;color:var(--ink)}.palpick .sw4{display:flex;height:12px}.palpick .sw4 i{flex:1}.palpick .nm{font-size:9px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.06em}
.colrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0}.colrow label{display:flex;flex-direction:column;gap:3px;color:var(--dim);font-size:9.5px}.colrow input[type=color]{width:100%;height:30px}
/* som */
.meter{display:flex;gap:3px;height:38px;align-items:flex-end;margin:6px 0 2px}.meter i{flex:1;background:var(--ink);opacity:.8;min-height:1px}.mlab{display:flex;gap:3px}.mlab span{flex:1;font-size:9px;color:var(--dim);text-align:center}
.prog{color:var(--acc)}
/* seletor de cor próprio */
#cp{position:fixed;z-index:45;background:var(--panel);border:1px solid #333;padding:10px;width:212px;box-shadow:0 8px 28px rgba(0,0,0,.6);user-select:none}#cp[hidden]{display:none}
#cp canvas{display:block;width:192px;cursor:crosshair;border:1px solid var(--line)}#cp .sv{height:128px}#cp .hue{height:14px;margin-top:8px}
#cp .row{display:flex;gap:6px;align-items:center;margin-top:8px}#cp .prev{width:28px;height:22px;border:1px solid #444;flex:none}#cp input{flex:1;min-width:0}
#cp .sw{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}#cp .sw button{width:20px;height:20px;padding:0;border:1px solid #444;border-radius:0}
kbd{font:inherit;color:var(--acc)}
code{color:var(--acc)}
</style>

<header>

<aside id="lib" data-ta="Biblioteca">
  <h2><span data-tx="COMPOSIÇÕES">COMPOSIÇÕES</span><span id="compsN"></span></h2><div id="comps"></div>

/* ---- diretor automático: troca de composição a cada tantos compassos, no tempo da música ----
   Conta os compassos pelo relógio da animação, que segue a música quando ela toca. Pular no tempo (scrub, música
   voltando ao início) ou trocar de composição à mão recomeça a contagem. No MP4, a mesma regra é calculada pelo
   número do quadro (dirSeq), então o vídeo sai igual em qualquer máquina. */
const DIR_EVERY=[1,2,4,8,16];
const DIR={on:false,bar:-1,count:0,next:-1,bag:[],self:false};
const barSec=()=>60/P.time.bpm*4,barsTxt=n=>TF(n===1?'{0} compasso':'{0} compassos',n);

function dirShuffle(a,rnd){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
// a seguinte: em sequência, a próxima da lista que entra; aleatória, um baralho que passa por todas antes de repetir
function dirPick(from,st,rnd){const L=dirSet();if(!L.length)return-1;if(P.live.dir.order==='aleatória'){st.bag=st.bag.filter(i=>L.includes(i)&&i!==from);if(!st.bag.length)st.bag=dirShuffle(L.filter(i=>i!==from),rnd);return st.bag.length?st.bag.shift():L[0]}const nx=L.find(i=>i>from);return nx!==undefined?nx:L[0]}

function dirTick(F){const b=Math.floor(F.beatF/4),nb=Math.max(1,Math.round(F.LF/(F.fpb*4)));

 const fwd=b===DIR.bar+1||(b===0&&DIR.bar>=nb-1);DIR.bar=b;
 if(!fwd){dirDrop();DIR.count=0;dirAhead();return}
 DIR.count++;if(DIR.count>=P.live.dir.every){DIR.count=0;const nx=DIR.next>=0?DIR.next:dirPick(P.ci,DIR,Math.random);DIR.next=-1;if(nx>=0&&nx!==P.ci){DIR.self=true;try{compGo(nx,true)}finally{DIR.self=false}}}
 dirAhead()}

function dirAhead(){if(DIR.on&&DIR.next<0&&P.live.dir.every-DIR.count<=1)DIR.next=dirPick(P.ci,DIR,Math.random);dirMark();const e=$('#dStat');if(e)e.textContent=dirTxt()}

// a sequência do MP4: começa na composição atual e segue a mesma regra, com o acaso tirado da semente do projeto
function dirSeq(nSeg){const rnd=mulberry((P.seed|0)*9973+17),st={bag:[]},out=[P.ci];for(let s=1;s<nSeg;s++){const nx=dirPick(out[s-1],st,rnd);out.push(nx<0?out[s-1]:nx)}return out}

const dirTour=()=>{const L=dirSet();return Math.max(1,L.length+(L.includes(P.ci)?0:1))};

/* ===== MIDI: APRENDER liga um knob ou um pad a um parâmetro, à opacidade de uma camada, a uma composição ou a uma ação ===== */
const MIDI={acc:null,ins:[],on:false,err:'',last:'',learn:null},MST=new WeakMap();
const MIDI_ACT=[['play','PLAY/PAUSA'],['song','MÚSICA'],['prev','ANTERIOR'],['next','PRÓXIMA'],['black','BLACKOUT'],['dir','DIRETOR'],['vary','VARIAR']];
async function midiOn(){if(MIDI.on)return;if(!navigator.requestMIDIAccess){MIDI.err=T('Este navegador não tem Web MIDI aqui. Use o Chrome ou o Edge.');if(ST.tab==='midi')renderMidi();return}
 try{MIDI.acc=await navigator.requestMIDIAccess({sysex:false});MIDI.on=true;MIDI.err='';MIDI.acc.onstatechange=midiPorts;midiPorts();toast(T('MIDI ligado'),1500)}

// com controles já ligados e a permissão dada antes, o MIDI liga sozinho ao abrir a ferramenta (sem pedir de novo)
async function midiAuto(){try{if(P.midi.map.length&&navigator.permissions&&(await navigator.permissions.query({name:'midi'})).state==='granted')midiOn()}catch(e){}}
function midiPorts(){if(!MIDI.acc)return;MIDI.ins=[...MIDI.acc.inputs.values()];MIDI.ins.forEach(i=>{i.onmidimessage=midiMsg});if(ST.tab==='midi')renderMidi()}
function midiStTxt(){if(MIDI.err)return MIDI.err;if(!MIDI.on)return T('Desligado.');return MIDI.ins.length?TF('Conectado: {0}.',MIDI.ins.map(i=>i.name||T('entrada')).join(', ')):T('Ligado, sem controlador. Conecte o cabo: ele aparece aqui sozinho.')}
function midiLearn(on){ST.learn=!!on;MIDI.learn=null;document.body.classList.toggle('learn',ST.learn);if(ST.tab==='midi')renderMidi();if(ST.learn)toast(T('MIDI: clique no que quer comandar (um parâmetro na aba CAMADA, uma composição à esquerda ou uma ação aqui).'),4000)}
function midiTarget(t){if(!ST.learn)return false;MIDI.learn=t;toast(TF('Agora mova um knob ou aperte um pad: {0}',t.label),3500);if(ST.tab==='midi')renderMidi();return true}
function midiMsg(ev){const d=ev.data;if(!d||d.length<2)return;const st=d[0]&0xF0,ch=d[0]&15,num=d[1],val=d.length>2?d[2]:0;let kind;if(st===0xB0)kind='cc';else if(st===0x90&&val>0)kind='on';else if(st===0x80||st===0x90)kind='off';else return;
 MIDI.last=(kind==='cc'?'CC ':T('NOTA')+' ')+num+' · '+T('CANAL')+' '+(ch+1)+(kind==='cc'?' · '+T('VALOR')+' '+val:kind==='on'?' · '+T('VELOCIDADE')+' '+val:' · '+T('SOLTOU'));const ml=$('#midiLast');if(ml)ml.textContent=T('Última mensagem')+': '+MIDI.last;
 if(ST.learn&&MIDI.learn&&kind!=='off'){midiBind(MIDI.learn,kind==='cc'?'cc':'note',ch,num);return}
 for(const m of P.midi.map)if(m.ch===ch&&m.num===num&&(m.src==='cc')===(kind==='cc'))midiDo(m,kind,val);ST.dirty=true}
function midiBind(t,src,ch,num){const M=P.midi.map,drop=(s,c,n)=>{for(let j=M.length-1;j>=0;j--)if(M[j].src===s&&M[j].ch===c&&M[j].num===n)M.splice(j,1)};
 if(t.kind==='pads'){if(src!=='note'){toast(T('Para os pads, aperte um pad (nota), não um knob.'),2500);return}const nC=Math.min(16,P.compositions.length);for(let i=0;i<nC;i++){drop('note',ch,num+i);M.push({src:'note',ch,num:num+i,kind:'comp',cid:P.compositions[i].id})}toast(TF('Notas {0} a {1} → composições 1 a {2}',num,num+nC-1,nC),3500)}
 else{drop(src,ch,num);const o={src,ch,num,kind:t.kind};['cid','lid','k','act'].forEach(q=>{if(t[q]!==undefined)o[q]=t[q]});M.push(o);toast(`${src==='cc'?'CC':T('Nota')} ${num} → ${t.label}`,2500)}
 midiLearn(false);save()}
// mostra na aba CAMADA o valor que o MIDI mudou, se a camada estiver aberta
function midiParamUi(L,k){if(ST.tab!=='par'||cur().layers[ST.sel]!==L)return;if(k==='__opacity'){$$('#paneLayer [data-l="opacity"]').forEach(i=>{i.value=L.opacity;const o=i.nextElementSibling;if(o&&o.tagName==='OUTPUT')o.textContent=(+L.opacity).toFixed(2)});return}const d=GEN[L.type].params.find(q=>q.k===k);if(d&&d.t==='n')paramSync([k]);else renderParams()}
function midiDo(m,kind,val){const v01=kind==='cc'?val/127:kind==='on'?1:0,S=MST.get(m)||{};MST.set(m,S);const press=kind==='on'||(kind==='cc'&&val>=64&&!S.hi);if(kind==='cc')S.hi=val>=64;
 if(m.kind==='comp'){if(press){const i=P.compositions.findIndex(c=>c.id===m.cid);if(i>=0)compGo(i,true)}return}
 if(m.kind==='act'){if(!press)return;const a=m.act,n=P.compositions.length;
  if(a==='play')playToggle();else if(a==='song')songToggle();else if(a==='prev'||a==='next')compGo(mod(P.ci+(a==='next'?1:-1),n),true);else if(a==='black')blackToggle();else if(a==='dir')dirToggle();else if(a==='vary')vary(false);return}
 if(m.kind==='param'){const c=P.compositions.find(x=>x.id===m.cid),L=c&&c.layers.find(l=>l.id===m.lid);if(!L)return;
  if(m.k==='__opacity'){if(kind==='off')return;L.opacity=kind==='cc'?Math.round(v01*100)/100:(L.opacity>0.5?0:1);midiParamUi(L,m.k);save();return}
  const d=(GEN[L.type]||{params:[]}).params.find(q=>q.k===m.k);if(!d)return;const st=L.p;
  if(d.t==='n'){if(kind==='cc'){const x=d.min+(d.max-d.min)*v01,sp=d.step||0.01;st[d.k]=+(Math.round(x/sp)*sp).toFixed(6)}else if(kind==='on'){S.prev=pm(L)[d.k];st[d.k]=d.max}else if(S.prev!==undefined){st[d.k]=S.prev;S.prev=undefined}else return}
  else if(d.t==='b'){if(kind==='cc')st[d.k]=val>=64;else if(kind==='on')st[d.k]=!pm(L)[d.k];else return}
  else if(d.t==='s'){if(kind!=='cc')return;const o=typeof d.o==='function'?d.o():d.o;if(!o.length)return;st[d.k]=o[Math.min(o.length-1,Math.floor(v01*o.length))]}
  else return;midiParamUi(L,d.k);save()}}
function midiLabel(m){if(m.kind==='comp'){const c=P.compositions.find(x=>x.id===m.cid);return T('COMPOSIÇÃO')+' '+(c?T(c.name):T('(apagada)'))}if(m.kind==='act')return T('AÇÃO')+' '+T((MIDI_ACT.find(a=>a[0]===m.act)||[])[1]||m.act);

function thumbRender(type,size=300){const cv=document.createElement('canvas');cv.width=cv.height=size;const c=cv.getContext('2d'),comp=cur(),pal=palOf(comp),F=frameInfo(0),lay=[mk('bg',{},{seed:3,band:'nenhum'})];

let thumbBusy=false;
function thumbQueue(){if(thumbBusy)return;thumbBusy=true;const run=()=>{const img=$$('img[data-th]').find(i=>!THUMB.has(thumbKey(i.dataset.th))||i.src!==THUMB.get(thumbKey(i.dataset.th)));if(!img){thumbBusy=false;return}const t=img.dataset.th,k=thumbKey(t);if(!THUMB.has(k)){try{THUMB.set(k,thumbRender(t))}catch(e){console.warn(e);THUMB.set(k,PH)}}$$(`img[data-th="${t}"]`).forEach(i=>i.src=THUMB.get(k));setTimeout(run,8)};setTimeout(run,8)}

async function svgImport(files){const out=[];for(const f of files){if(!/\.svg$/i.test(f.name)&&f.type!=='image/svg+xml'){toast(T('Só arquivos .svg'));continue}if(f.size>4e6){toast(TF('{0} é grande demais (máximo 4 MB)',f.name));continue}try{out.push(assetAdd(f.name,await f.text()))}catch(e){toast(f.name+': '+e.message,2600)}}

function hsl2hex(h,s,l){h=mod(h,360)/360;const f=n=>{const k=(n+h*12)%12,a=s*Math.min(l,1-l);return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))))};return'#'+[f(0),f(8),f(4)].map(v=>v.toString(16).padStart(2,'0')).join('')}
function palRandom(){const h=Math.random()*360,dark=Math.random()<0.45,r=Math.random;return dark?{bg:hsl2hex(h,0.25,0.05+r()*0.04),primary:hsl2hex(h+20,0.2,0.9),secondary:hsl2hex(h+40,0.25,0.42),accent:hsl2hex(h+150+r()*60,0.9,0.56)}:{bg:hsl2hex(h,0.3,0.92+r()*0.04),primary:hsl2hex(h+200,0.55,0.16+r()*0.1),secondary:hsl2hex(h+30,0.5,0.55),accent:hsl2hex(h+160+r()*40,0.85,0.52)}}

 vivo:['<h4>AO VIVO</h4><p>A janela de saída mostra só a prancheta: arraste para o projetor e dê duplo clique para tela cheia. As teclas da ferramenta funcionam nela.</p><p>Blackout (B) escurece a vista e a saída, sem mexer no que é exportado.</p>','<h4>LIVE</h4><p>The output window shows only the artboard: drag it to the projector and double-click for full screen. The tool keys work in it.</p><p>Blackout (B) darkens the view and the output, without touching what is exported.</p>'],
 cores:['<h4>CORES</h4><p>Cada composição tem a própria paleta de quatro cores. Nos parâmetros das camadas, as cores são escolhidas pela função (fundo, primária, secundária, acento) ou por um hex próprio.</p>','<h4>COLORS</h4><p>Each composition has its own four-color palette. In the layer parameters, colors are picked by role (background, primary, secondary, accent) or by a custom hex.</p>'],
 som:['<h4>SOM</h4><p>Com uma música carregada, a faixa é analisada de uma vez (graves, médios, agudos, energia e ataques, 30 vezes por segundo). Tocando, a animação segue o relógio da música.</p><p>O microfone reage ao vivo. Na aba CAMADA, cada camada escolhe a faixa e o ganho; o texto embaixo diz o que o som mexe naquela forma.</p>','<h4>SOUND</h4><p>With a song loaded, the track is analyzed once (bass, mids, highs, energy and attacks, 30 times a second). While playing, the animation follows the song clock.</p><p>The microphone reacts live. In the LAYER tab, each layer picks a band and a gain; the text below says what the sound moves in that shape.</p>'],
 dir:['<h4>DIRETOR AUTOMÁTICO</h4><p>Troca de composição sozinho, a cada 1, 2, 4, 8 ou 16 compassos, sempre no começo do compasso. Tocando música, segue o tempo dela; sem música, o BPM do projeto.</p><p>A ordem é a da lista ou aleatória (passa por todas antes de repetir). Marque as composições que entram; a próxima pisca na lista. Na aba EXPORTAR, o MP4 pode seguir o diretor e sai com a mesma sequência.</p>','<h4>AUTO DIRECTOR</h4><p>Switches compositions on its own every 1, 2, 4, 8 or 16 bars, always at the start of a bar. With music playing it follows its tempo; without music, the project BPM.</p><p>The order follows the list or is random (it goes through all of them before repeating). Mark the compositions that take part; the next one blinks in the list. In the EXPORT tab, the MP4 can follow the director and comes out with the same sequence.</p>'],
 midi:['<h4>MIDI</h4><p>LIGAR MIDI e depois APRENDER: clique no que quer comandar (um parâmetro na aba CAMADA, a opacidade da camada, uma composição na lista ou uma ação aqui) e mova um knob ou aperte um pad.</p><p>PADS → COMPOSIÇÕES liga o primeiro pad apertado e os seguintes às composições 1, 2, 3… Os controles ficam no projeto e no JSON. Esc sai do modo aprender. Funciona no Chrome e no Edge.</p>','<h4>MIDI</h4><p>TURN ON MIDI, then LEARN: click what you want to control (a parameter in the LAYER tab, the layer opacity, a composition in the list or an action here) and move a knob or press a pad.</p><p>PADS → COMPOSITIONS binds the first pad pressed and the next ones to compositions 1, 2, 3… Bindings are kept in the project and in the JSON. Esc leaves learn mode. Works in Chrome and Edge.</p>'],
 svg:['<h4>SVG</h4><p>O quadro atual em vetores. Cada camada vira um grupo (aparece como camada no Inkscape e como grupo no Illustrator e no Figma). Opacidade e mistura das camadas vão junto.</p><p>Desligue a camada Fundo para exportar com fundo transparente. COPIAR SVG põe o código na área de transferência: dá para colar direto no Figma.</p>','<h4>SVG</h4><p>The current frame in vectors. Each layer becomes a group (a layer in Inkscape, a group in Illustrator and Figma). Layer opacity and blending go along.</p><p>Turn off the Background layer to export with a transparent background. COPY SVG puts the code on the clipboard: you can paste it straight into Figma.</p>'],
 mp4:['<h4>VÍDEO MP4</h4><p>O motor desenha quadro a quadro, sem perder quadros, e codifica no próprio navegador (H.264). Com música carregada, o áudio entra em AAC (ou Opus no Firefox).</p><p>Formatos diferentes do projeto reorganizam a composição na hora, porque as medidas são relativas. Loops fecham: 2 ou 4 loops viram um vídeo mais longo sem emenda.</p>','<h4>MP4 VIDEO</h4><p>The engine draws frame by frame, without dropping frames, and encodes in the browser itself (H.264). With a song loaded, the audio goes in as AAC (or Opus in Firefox).</p><p>Formats other than the project rearrange the composition on the fly, since the measures are relative. Loops close: 2 or 4 loops make a longer seamless video.</p>']};
